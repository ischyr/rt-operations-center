<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie Exporter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      min-height: 200px;
      background: #111116;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    .top-bar {
      height: 2px;
      background: linear-gradient(to right, transparent, rgba(104,211,145,0.8), transparent);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .icon-box {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: rgba(104,211,145,0.12);
      border: 1px solid rgba(104,211,145,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-box svg { width: 16px; height: 16px; stroke: #68D391; }

    .header-text h1 {
      font-size: 13px;
      font-weight: 700;
      color: #f7fafc;
      line-height: 1.3;
    }

    .header-text p {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      margin-top: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 240px;
    }

    .body { padding: 12px 16px; }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .cookie-count {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
    }

    .cookie-count span {
      color: #68D391;
      font-weight: 700;
    }

    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: rgba(104,211,145,0.14);
      border-color: rgba(104,211,145,0.4);
      color: #68D391;
    }

    .cookie-list {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 9px;
      background: rgba(0,0,0,0.25);
      margin-bottom: 12px;
    }

    .cookie-list::-webkit-scrollbar { width: 4px; }
    .cookie-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    .cookie-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      gap: 8px;
    }

    .cookie-item:last-child { border-bottom: none; }

    .cookie-item input[type="checkbox"] {
      accent-color: #68D391;
      cursor: pointer;
      flex-shrink: 0;
    }

    .cookie-name {
      flex: 1;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      color: #68D391;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cookie-value {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      font-family: 'Courier New', monospace;
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .empty-state {
      padding: 24px 16px;
      text-align: center;
      color: rgba(255,255,255,0.3);
      font-size: 12px;
    }

    .actions { display: flex; gap: 8px; }

    .btn {
      flex: 1;
      padding: 9px 12px;
      border-radius: 9px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: rgba(104,211,145,0.2);
      color: #68D391;
      border: 1px solid rgba(104,211,145,0.4);
    }

    .btn-primary:hover { background: rgba(104,211,145,0.3); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-secondary {
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .btn-secondary:hover { background: rgba(255,255,255,0.09); color: white; }

    .success-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(104,211,145,0.1);
      border: 1px solid rgba(104,211,145,0.25);
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 11px;
      color: #68D391;
    }

    .success-bar.show { display: flex; }

    .select-all-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
    }

    .select-all-row:hover { color: rgba(255,255,255,0.7); }
    .select-all-row input { accent-color: #68D391; cursor: pointer; }
  </style>
</head>
<body>
  <div class="top-bar"></div>

  <div class="header">
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
        <path d="M8 12h8M12 8v8"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Cookie Exporter</h1>
      <p id="current-url">Loading...</p>
    </div>
  </div>

  <div class="body">
    <div class="success-bar" id="success-bar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#68D391" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <span id="success-msg">Exported!</span>
    </div>

    <div class="meta-row">
      <div class="cookie-count">
        <span id="total-count">0</span> cookies found for this domain
      </div>
    </div>

    <div class="filter-row" id="filter-row"></div>

    <div class="cookie-list" id="cookie-list">
      <div class="empty-state">Loading cookies...</div>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" id="btn-copy" disabled>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copy JSON
      </button>
      <button class="btn btn-primary" id="btn-export" disabled>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Export JSON
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
